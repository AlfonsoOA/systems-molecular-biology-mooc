name: Build and test the MOOC image

# Builds the MOOC image (the course image + the Plant Cell 2025 packages), publishes it
# to GHCR, then runs the Plant Cell scripts inside it on a machine the size of the MOOC
# codespace (4 CPU; 13 GB, what is left of the 16 GB next to the editor and RStudio).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".devcontainer/**", "scripts/**", "tests/**", ".github/workflows/build-image.yml"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/bmsi-mooc
  TAG: "2026-27"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space on the runner
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lower-case image name
        run: echo "IMAGE=${IMAGE,,}" >> $GITHUB_ENV
      - name: Build and push (log tail reported as an annotation if it fails)
        run: |
          set -o pipefail
          if ! docker build --progress=plain -t $IMAGE:$TAG .devcontainer/build 2>&1 | tee build.log; then
            msg=$(tail -n 80 build.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Image build failed::$msg"
            exit 1
          fi
          docker push $IMAGE:$TAG

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space on the runner
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Lower-case image name
        run: echo "IMAGE=${IMAGE,,}" >> $GITHUB_ENV
      - name: Run the Plant Cell scripts at codespace size (4 CPU, 13 GB)
        run: |
          docker pull $IMAGE:$TAG
          docker run --rm --cpus 4 --memory 13g --memory-swap 13g -e HOME=/root \
            -v "$PWD":/repo -w /repo $IMAGE:$TAG bash tests/run_plantcell.sh | tee test.log
          echo "### Plant Cell scripts (4 CPU, 13 GB)" >> $GITHUB_STEP_SUMMARY
          grep '^|' test.log >> $GITHUB_STEP_SUMMARY
          echo "::notice title=Plant Cell test::$(grep '^|' test.log | sed ':a;N;$!ba;s/\n/%0A/g')"
          for f in test_logs/*.log; do
            if grep -qE "^Error|Execution halted" "$f"; then
              echo "::error title=$(basename $f)::$(tail -n 25 "$f" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            fi
          done
          echo "::notice title=Cached or computed::$(grep -ihE 'cached|using|fitting|compil|minutes|min\)' test_logs/*_Chlamy*.log test_logs/Proteomic_TMT.log 2>/dev/null | head -n 50 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
          ! grep -qE 'FAILED|MISSING' test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs
          path: test_logs/
